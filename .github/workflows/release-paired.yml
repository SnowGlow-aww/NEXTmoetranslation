name: Release paired image

on:
  workflow_dispatch:
    inputs:
      moe_tag:
        description: Official SekaiText-Moe tag (v followed by strict SemVer)
        required: true
        type: string
      moe_commit:
        description: Exact 40-character lowercase SekaiText-Moe commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paired-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish paired image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.final.outputs.image_digest }}
    env:
      NODE_IMAGE: node:20.19.4-alpine3.22
      NODE_IMAGE_DIGEST: ${{ vars.NODE_IMAGE_DIGEST }}
      GO_IMAGE: golang:1.25.1-alpine3.22
      GO_IMAGE_DIGEST: ${{ vars.GO_IMAGE_DIGEST }}
      RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
      RUNTIME_IMAGE_DIGEST: ${{ vars.RUNTIME_IMAGE_DIGEST }}
      PAIRED_PREDICATE_TYPE: https://github.com/StarMoe-org/NEXTmoetrabslation/attestations/paired-image/v1
    steps:
      - name: Check out exact protected NEXT source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require protected default-branch dispatch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Require successful CI for the exact NEXT commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs")
          latest=$(printf '%s' "$runs" | jq -c --arg sha "$GITHUB_SHA" --arg branch "$DEFAULT_BRANCH" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .event == "push")]
            | sort_by(.run_number, .run_attempt)
            | last // empty')
          test -n "$latest"
          test "$(printf '%s' "$latest" | jq -r .status)" = "completed"
          test "$(printf '%s' "$latest" | jq -r .conclusion)" = "success"

      - name: Set up Go for NEXT-owned verification
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version: 1.25.1
          cache-dependency-path: server/go.sum

      - name: Validate pair and approved base inputs
        working-directory: server
        shell: bash
        env:
          MOE_TAG: ${{ inputs.moe_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
        run: |
          set -euo pipefail
          go run ./cmd/paired-release validate-inputs --moe-tag "$MOE_TAG" --moe-commit "$MOE_COMMIT"
          for digest in "$NODE_IMAGE_DIGEST" "$GO_IMAGE_DIGEST" "$RUNTIME_IMAGE_DIGEST"; do
            printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          for image in "$NODE_IMAGE" "$GO_IMAGE" "$RUNTIME_IMAGE"; do
            printf '%s' "$image" | grep -Eq '^[a-z0-9][a-z0-9./:_-]*$'
            case "$image" in *@*) exit 1;; esac
          done

      - name: Create narrow producer release-reader token
        id: producer-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.MOE_RELEASE_READER_APP_ID }}
          private-key: ${{ secrets.MOE_RELEASE_READER_PRIVATE_KEY }}
          owner: SnowGlow-aww
          repositories: SekaiText-Moe
          permission-contents: read

      - name: Resolve and peel the official producer tag
        working-directory: server
        shell: bash
        env:
          GH_TOKEN: ${{ steps.producer-token.outputs.token }}
          MOE_TAG: ${{ inputs.moe_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
        run: |
          set -euo pipefail
          go run ./cmd/paired-release resolve-tag \
            --moe-tag "$MOE_TAG" \
            --moe-commit "$MOE_COMMIT" \
            --token-env GH_TOKEN

      - name: Select and download only the five workspace assets
        shell: bash
        env:
          GH_TOKEN: ${{ steps.producer-token.outputs.token }}
          MOE_TAG: ${{ inputs.moe_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/moe-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          download_plan="$RUNNER_TEMP/moe-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          assets="$RUNNER_TEMP/moe-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f "$release_json" "$download_plan"' EXIT
          mkdir -p "$assets"
          gh api --method GET "repos/SnowGlow-aww/SekaiText-Moe/releases/tags/${MOE_TAG}" > "$release_json"
          (cd server && go run ./cmd/paired-release select-assets \
            --release-json "$release_json" \
            --output "$download_plan" \
            --moe-tag "$MOE_TAG" \
            --moe-commit "$MOE_COMMIT")
          while IFS=$'\t' read -r asset_id asset_name expected_size; do
            partial="$assets/$asset_name.partial"
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/SnowGlow-aww/SekaiText-Moe/releases/assets/${asset_id}" > "$partial"
            actual_size=$(wc -c < "$partial" | tr -d '[:space:]')
            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "::error::Downloaded asset byte count differs from immutable release metadata"
              exit 1
            fi
            mv "$partial" "$assets/$asset_name"
          done < "$download_plan"
          (cd server && go run ./cmd/paired-release validate-downloads \
            --download-plan "$download_plan" \
            --assets-dir "$assets" \
            --moe-commit "$MOE_COMMIT")

      - name: Install exact Cosign v3.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Require exact Cosign runtime version
        run: test "$(cosign version --json | jq -r .gitVersion)" = "v3.1.2"

      - name: Verify and safely extract the signed workspace
        id: workspace
        working-directory: server
        shell: bash
        env:
          MOE_TAG: ${{ inputs.moe_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
        run: |
          set -euo pipefail
          go run ./cmd/paired-release consume \
            --assets-dir "$RUNNER_TEMP/moe-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --workspace-dir "$RUNNER_TEMP/moe-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --moe-tag "$MOE_TAG" \
            --moe-commit "$MOE_COMMIT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Derive staging and immutable image names
        id: image
        shell: bash
        env:
          MOE_OCI_TAG: ${{ steps.workspace.outputs.moe_oci_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repository}"
          staging_tag="${image}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag_semver="${image}:next-${GITHUB_SHA}-moe-${MOE_OCI_TAG}"
          tag_commit="${image}:next-${GITHUB_SHA}-moe-${MOE_COMMIT}"
          printf 'image=%s\nstaging_tag=%s\ntag_semver=%s\ntag_commit=%s\n' "$image" "$staging_tag" "$tag_semver" "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Require the run-scoped staging tag to be unused
        shell: bash
        env:
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
        run: |
          set -euo pipefail
          diagnostic=$(mktemp)
          if docker buildx imagetools inspect "$STAGING_TAG" > /dev/null 2> "$diagnostic"; then
            echo "::error::Run-scoped staging tag already exists"
            rm -f "$diagnostic"
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|name unknown' "$diagnostic"; then
            echo "::error::Could not prove run-scoped staging tag absence"
            rm -f "$diagnostic"
            exit 1
          fi
          rm -f "$diagnostic"

      - name: Build and push default paired target
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: paired
          push: true
          build-contexts: |
            workspace=${{ steps.workspace.outputs.workspace_dir }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NODE_IMAGE_DIGEST=${{ env.NODE_IMAGE_DIGEST }}
            GO_IMAGE=${{ env.GO_IMAGE }}
            GO_IMAGE_DIGEST=${{ env.GO_IMAGE_DIGEST }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            RUNTIME_IMAGE_DIGEST=${{ env.RUNTIME_IMAGE_DIGEST }}
            VERSION=next-${{ github.sha }}-moe-${{ inputs.moe_tag }}
            VCS_REF=${{ github.sha }}
            NEXT_REVISION=${{ github.sha }}
            MOE_REVISION=${{ inputs.moe_commit }}
            MOE_TAG=${{ inputs.moe_tag }}
            WORKSPACE_ARCHIVE_SHA256=${{ steps.workspace.outputs.archive_digest }}
            WORKSPACE_MANIFEST_SHA256=${{ steps.workspace.outputs.manifest_digest }}
          tags: ${{ steps.image.outputs.staging_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.sekaitext.pair.next.revision=${{ github.sha }}
            io.sekaitext.pair.moe.revision=${{ inputs.moe_commit }}
            io.sekaitext.pair.moe.tag=${{ inputs.moe_tag }}
            io.sekaitext.pair.workspace.archive.digest=sha256:${{ steps.workspace.outputs.archive_digest }}
            io.sekaitext.pair.workspace.manifest.digest=sha256:${{ steps.workspace.outputs.manifest_digest }}

      - name: Require staging tag to resolve to the built digest
        shell: bash
        env:
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          staging_digest=$(docker buildx imagetools inspect "$STAGING_TAG" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          test "$staging_digest" = "$IMAGE_DIGEST"

      - name: Create custom paired predicate
        id: predicate
        working-directory: server
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          MOE_TAG: ${{ inputs.moe_tag }}
          MOE_COMMIT: ${{ inputs.moe_commit }}
          ARCHIVE_DIGEST: ${{ steps.workspace.outputs.archive_digest }}
          MANIFEST_DIGEST: ${{ steps.workspace.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          predicate="$RUNNER_TEMP/paired-predicate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          go run ./cmd/paired-release predicate \
            --output "$predicate" \
            --next-repository "https://github.com/${GITHUB_REPOSITORY}" \
            --next-commit "$GITHUB_SHA" \
            --moe-tag "$MOE_TAG" \
            --moe-commit "$MOE_COMMIT" \
            --archive-sha256 "$ARCHIVE_DIGEST" \
            --manifest-sha256 "$MANIFEST_DIGEST" \
            --image "$IMAGE" \
            --image-digest "$IMAGE_DIGEST"
          echo "path=$predicate" >> "$GITHUB_OUTPUT"

      - name: Sign, attest, and validate staged image digest with GitHub OIDC
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PREDICATE: ${{ steps.predicate.outputs.path }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
          cosign attest --yes \
            --type "$PAIRED_PREDICATE_TYPE" \
            --predicate "$PREDICATE" \
            "${IMAGE}@${IMAGE_DIGEST}"
          certificate_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-paired.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "${IMAGE}@${IMAGE_DIGEST}" > /dev/null
          verification="$RUNNER_TEMP/paired-attestation-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cosign verify-attestation \
            --type "$PAIRED_PREDICATE_TYPE" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "${IMAGE}@${IMAGE_DIGEST}" > "$verification"
          (cd server && go run ./cmd/paired-release validate-attestation \
            --verification-json "$verification" \
            --predicate "$PREDICATE" \
            --predicate-type "$PAIRED_PREDICATE_TYPE" \
            --image "$IMAGE" \
            --image-digest "$IMAGE_DIGEST")

      - name: Generate GitHub build provenance where supported
        if: vars.GITHUB_ARTIFACT_ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate GitHub paired attestation where supported
        if: vars.GITHUB_ARTIFACT_ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: ${{ env.PAIRED_PREDICATE_TYPE }}
          predicate-path: ${{ steps.predicate.outputs.path }}
          push-to-registry: true

      - name: Promote verified digest to the two final pair tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          TAG_SEMVER: ${{ steps.image.outputs.tag_semver }}
          TAG_COMMIT: ${{ steps.image.outputs.tag_commit }}
        run: |
          set -euo pipefail
          inspect_tags() {
            local output=$1
            : > "$output"
            for tag in "$TAG_SEMVER" "$TAG_COMMIT"; do
              local diagnostic manifest digest
              diagnostic=$(mktemp)
              if manifest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' 2> "$diagnostic"); then
                digest=$(printf '%s' "$manifest" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
                printf '%s\t%s\n' "$tag" "$digest" >> "$output"
              else
                if ! grep -Eqi 'not found|manifest unknown|name unknown' "$diagnostic"; then
                  echo "::error::Could not resolve final pair tag state"
                  rm -f "$diagnostic"
                  exit 1
                fi
                printf '%s\t-\n' "$tag" >> "$output"
              fi
              rm -f "$diagnostic"
            done
          }

          state="$RUNNER_TEMP/pair-tag-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          missing="$RUNNER_TEMP/pair-tags-missing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          inspect_tags "$state"
          (cd server && go run ./cmd/paired-release validate-tags \
            --state "$state" \
            --missing-output "$missing" \
            --expected-image-digest "$IMAGE_DIGEST" \
            --tag-semver "$TAG_SEMVER" \
            --tag-commit "$TAG_COMMIT")

          tag_arguments=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_arguments+=(--tag "$tag")
          done < "$missing"
          if (( ${#tag_arguments[@]} > 0 )); then
            docker buildx imagetools create --prefer-index=false "${tag_arguments[@]}" "${IMAGE}@${IMAGE_DIGEST}"
          fi

          post_state="$RUNNER_TEMP/pair-tag-state-post-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          inspect_tags "$post_state"
          (cd server && go run ./cmd/paired-release validate-tags \
            --state "$post_state" \
            --expected-image-digest "$IMAGE_DIGEST" \
            --tag-semver "$TAG_SEMVER" \
            --tag-commit "$TAG_COMMIT" \
            --require-present)

      - name: Output final immutable image digest
        id: final
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          TAG_SEMVER: ${{ steps.image.outputs.tag_semver }}
          TAG_COMMIT: ${{ steps.image.outputs.tag_commit }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo '### Paired image publication'
            echo
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- Immutable tag: \`${TAG_SEMVER}\`"
            echo "- Immutable tag: \`${TAG_COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
