name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_IMAGE: node:20.19.4-alpine3.22
      NODE_IMAGE_DIGEST: ${{ vars.NODE_IMAGE_DIGEST }}
      GO_IMAGE: golang:1.25.1-alpine3.22
      GO_IMAGE_DIGEST: ${{ vars.GO_IMAGE_DIGEST }}
      RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
      RUNTIME_IMAGE_DIGEST: ${{ vars.RUNTIME_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.1
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go
        working-directory: server
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
      - name: Verify Web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - name: Verify release contracts
        run: ./scripts/verify-release.sh
      - name: Validate immutable image inputs
        run: |
          for digest in "$NODE_IMAGE_DIGEST" "$GO_IMAGE_DIGEST" "$RUNTIME_IMAGE_DIGEST"; do
            printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          test -n "$RUNTIME_IMAGE"
          case "$RUNTIME_IMAGE" in *@*) exit 1;; esac
      - name: Build and inspect runtime image
        run: |
          docker build \
            --build-arg NODE_IMAGE="$NODE_IMAGE" \
            --build-arg NODE_IMAGE_DIGEST="$NODE_IMAGE_DIGEST" \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg GO_IMAGE_DIGEST="$GO_IMAGE_DIGEST" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg RUNTIME_IMAGE_DIGEST="$RUNTIME_IMAGE_DIGEST" \
            --build-arg VERSION="$GITHUB_SHA" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "moesekai-ci:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "moesekai-ci:$GITHUB_SHA")" = '65532:65532'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "moesekai-ci:$GITHUB_SHA")" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh "moesekai-ci:$GITHUB_SHA" -c 'test "$(id -u)" -eq 65532 && test -w /data && command -v git >/dev/null'
      - name: Build immutable rollback bundle
        run: |
          mkdir -p dist
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o ../dist/moesekai-server .)
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o ../dist/moesekai-migrate ./cmd/migrate)
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -czf dist/web.tar.gz -C web/out .
          sha256sum dist/moesekai-server dist/moesekai-migrate dist/web.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollback-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: false
          compression-level: 0
