name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_IMAGE: node:20.19.4-alpine3.22
      NODE_IMAGE_DIGEST: ${{ vars.NODE_IMAGE_DIGEST }}
      GO_IMAGE: golang:1.25.1-alpine3.22
      GO_IMAGE_DIGEST: ${{ vars.GO_IMAGE_DIGEST }}
      RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
      RUNTIME_IMAGE_DIGEST: ${{ vars.RUNTIME_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan committed content for secrets and local configuration
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/scan-committed-secrets.mjs
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.25.1
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go
        working-directory: server
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
      - name: Verify Web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - name: Verify release contracts
        run: ./scripts/verify-release.sh
      - name: Validate immutable image inputs
        run: |
          for digest in "$NODE_IMAGE_DIGEST" "$GO_IMAGE_DIGEST" "$RUNTIME_IMAGE_DIGEST"; do
            printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          done
          test -n "$RUNTIME_IMAGE"
          case "$RUNTIME_IMAGE" in *@*) exit 1;; esac
      - name: Build and inspect runtime image
        run: |
          docker build \
            --target runtime \
            --build-arg NODE_IMAGE="$NODE_IMAGE" \
            --build-arg NODE_IMAGE_DIGEST="$NODE_IMAGE_DIGEST" \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg GO_IMAGE_DIGEST="$GO_IMAGE_DIGEST" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg RUNTIME_IMAGE_DIGEST="$RUNTIME_IMAGE_DIGEST" \
            --build-arg VERSION="$GITHUB_SHA" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "moesekai-ci:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "moesekai-ci:$GITHUB_SHA")" = '65532:65532'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "moesekai-ci:$GITHUB_SHA")" = "$GITHUB_SHA"
          docker run --rm --entrypoint /bin/sh "moesekai-ci:$GITHUB_SHA" -c '
            test "$(id -u)" -eq 65532 && test -w /data && test -w /tmp &&
            test ! -w /app && test ! -w /app/web &&
            test -z "$(find /app ! -user root -print -quit)" &&
            test -z "$(find /app \( -perm -0200 -o -perm -0020 -o -perm -0002 \) -print -quit)" &&
            command -v git >/dev/null
          '
      - name: Build immutable paired image
        run: |
          workspace_manifest_sha=$(sha256sum server/internal/workspaceverify/testdata/valid/web-workspace-manifest.json | cut -d' ' -f1)
          workspace_archive_sha=$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C server/internal/workspaceverify/testdata/valid . | sha256sum | cut -d' ' -f1)
          docker build \
            --target paired \
            --build-context workspace=server/internal/workspaceverify/testdata/valid \
            --build-arg WORKSPACE_MANIFEST_SHA256="$workspace_manifest_sha" \
            --build-arg WORKSPACE_ARCHIVE_SHA256="$workspace_archive_sha" \
            --build-arg NEXT_REVISION="$GITHUB_SHA" \
            --build-arg MOE_REVISION=0123456789abcdef0123456789abcdef01234567 \
            --build-arg MOE_TAG=v0.0.0-ci \
            --build-arg NODE_IMAGE="$NODE_IMAGE" \
            --build-arg NODE_IMAGE_DIGEST="$NODE_IMAGE_DIGEST" \
            --build-arg GO_IMAGE="$GO_IMAGE" \
            --build-arg GO_IMAGE_DIGEST="$GO_IMAGE_DIGEST" \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            --build-arg RUNTIME_IMAGE_DIGEST="$RUNTIME_IMAGE_DIGEST" \
            --build-arg VERSION="$GITHUB_SHA" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "moesekai-paired-ci:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "moesekai-paired-ci:$GITHUB_SHA")" = '65532:65532'
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "moesekai-paired-ci:$GITHUB_SHA" | grep -Fx 'MOESEKAI_PRODUCTION=true'
          docker run --rm --entrypoint /bin/sh "moesekai-paired-ci:$GITHUB_SHA" -c '
            test "$(id -u)" -eq 65532 && test "$WORKSPACE_WEB_DIR" = /app/workspace &&
            test "$MOESEKAI_PRODUCTION" = true && test -n "$WORKSPACE_MANIFEST_SHA256" && test -w /data && test -w /tmp &&
            test ! -w /app && test ! -w /app/web && test ! -w /app/workspace &&
            test -z "$(find /app ! -user root -print -quit)" &&
            test -z "$(find /app \( -perm -0200 -o -perm -0020 -o -perm -0002 \) -print -quit)" &&
            test "$(stat -c %u /app/moesekai-server)" -eq 0 &&
            test "$(stat -c %u /app/web/index.html)" -eq 0 &&
            test "$(stat -c %u /app/workspace/index.html)" -eq 0 &&
            ! chmod u+w /app &&
            ! mv /app/workspace /app/workspace-renamed &&
            ! printf x >> /app/moesekai-server &&
            ! printf x >> /app/web/index.html &&
            ! printf x >> /app/workspace/assets/app.js &&
            ./moesekai-server --verify-workspace
          '
      - name: Assert paired production startup fails closed
        run: |
          image="moesekai-paired-ci:$GITHUB_SHA"
          if docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            "$image" >/tmp/moesekai-missing-secrets.log 2>&1; then
            cat /tmp/moesekai-missing-secrets.log
            exit 1
          fi
          grep -F 'MOESEKAI_MASTER_KEY must contain at least 32 bytes' /tmp/moesekai-missing-secrets.log
          if docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            -e JWT_SECRET=ci-synthetic-jwt-secret-at-least-32-bytes \
            -e MOESEKAI_MASTER_KEY=ci-synthetic-master-key-at-least-32-bytes \
            -e CONSOLE_ORIGIN=http://127.0.0.1 \
            -e TRANSLATE_SCHEDULER_ENABLED=false \
            "$image" >/tmp/moesekai-missing-admin.log 2>&1; then
            cat /tmp/moesekai-missing-admin.log
            exit 1
          fi
          grep -F 'an initialized administrator is required' /tmp/moesekai-missing-admin.log
      - name: Smoke paired entrypoint
        run: |
          container="moesekai-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          competitor="$container-competitor"
          volume="$container-data"
          python3 -m http.server 18080 --bind 0.0.0.0 --directory server/internal/searchindex/testdata/masterdata \
            >/tmp/moesekai-masterdata-server.log 2>&1 &
          masterdata_pid=$!
          sleep 1
          cleanup() {
            docker logs "$container" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker rm -f "$competitor" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            kill "$masterdata_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          create_smoke() {
            docker create --name "$container" -p 127.0.0.1::8080 \
              --add-host host.docker.internal:host-gateway \
              --read-only --mount "type=volume,src=$volume,dst=/data" \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              -e JWT_SECRET=ci-synthetic-jwt-secret-at-least-32-bytes \
              -e MOESEKAI_MASTER_KEY=ci-synthetic-master-key-at-least-32-bytes \
              -e CONSOLE_ORIGIN=http://127.0.0.1 \
              -e UPSTREAM_JP_MASTERDATA_URL=http://host.docker.internal:18080 \
              -e UPSTREAM_JP_MASTERDATA_FALLBACK_URL=http://host.docker.internal:18080 \
              -e SEARCH_INDEX_RETRY_MIN_MS=100 \
              -e SEARCH_INDEX_RETRY_MAX_MS=1000 \
              -e TRANSLATE_SCHEDULER_ENABLED=false "$@" \
              "moesekai-paired-ci:$GITHUB_SHA" >/dev/null
          }
          wait_ready() {
            endpoint=$(docker port "$container" 8080/tcp)
            port=${endpoint##*:}
            origin="http://127.0.0.1:$port"
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$origin/readyz" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
          }
          stop_cleanly() {
            started=$(date +%s)
            timeout 40s docker stop --time 30 "$container" >/dev/null
            elapsed=$(($(date +%s) - started))
            test "$elapsed" -le 40
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
            docker logs "$container" > /tmp/moesekai-clean-stop.log 2>&1
            grep -F 'shutdown requested by terminated' /tmp/moesekai-clean-stop.log
            if grep -E 'CRITICAL: total shutdown budget|shutdown completed after forced cancellation|force-close HTTP:' \
              /tmp/moesekai-clean-stop.log; then exit 1; fi
          }
          create_smoke -e ADMIN_USER=ci-admin -e ADMIN_PASSWORD=ci-synthetic-admin-password
          docker start "$container" >/dev/null
          wait_ready
          docker exec "$container" test -s /data/moesekai.db
          if docker run --rm --read-only --mount "type=volume,src=$volume,dst=/data" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            -e JWT_SECRET=ci-synthetic-jwt-secret-at-least-32-bytes \
            -e MOESEKAI_MASTER_KEY=ci-synthetic-master-key-at-least-32-bytes \
            -e CONSOLE_ORIGIN=http://127.0.0.1 \
            -e TRANSLATE_SCHEDULER_ENABLED=false \
            "moesekai-paired-ci:$GITHUB_SHA" >/tmp/moesekai-competing-instance.log 2>&1; then
            cat /tmp/moesekai-competing-instance.log
            exit 1
          fi
          grep -F 'database is already owned by another process' /tmp/moesekai-competing-instance.log
          curl --fail --silent --show-error "$origin/healthz" | grep -Fx '{"status":"ok"}'
          curl --fail --silent --show-error "$origin/readyz" | grep -Fx '{"status":"ready"}'
          status=$(curl --silent --show-error --output /tmp/unknown-api.json --dump-header /tmp/unknown-api.headers --write-out '%{http_code}' "$origin/api/does-not-exist")
          test "$status" = 404
          grep -Eiq '^content-type: application/json(; charset=utf-8)?' /tmp/unknown-api.headers
          grep -Fx '{"error":"not found"}' /tmp/unknown-api.json
          stop_cleanly
          docker rm "$container" >/dev/null
          create_smoke
          docker start "$container" >/dev/null
          wait_ready
          curl --fail --silent --show-error "$origin/readyz" | grep -Fx '{"status":"ready"}'
          stop_cleanly
      - name: Build immutable rollback bundle
        run: |
          rm -rf dist
          rm -rf /tmp/rollback-verify /tmp/moesekai-rollback-second.tar
          mkdir -p dist/rollback/web /tmp/rollback-verify
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o ../dist/rollback/moesekai-server .)
          (cd server && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o ../dist/rollback/moesekai-migrate ./cmd/migrate)
          cp -a web/out/. dist/rollback/web/
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./scripts/package-rollback.sh dist/rollback dist/moesekai-rollback.tar
          ./scripts/package-rollback.sh dist/rollback /tmp/moesekai-rollback-second.tar
          cmp dist/moesekai-rollback.tar /tmp/moesekai-rollback-second.tar
          tar -xf dist/moesekai-rollback.tar -C /tmp/rollback-verify
          test -x /tmp/rollback-verify/moesekai-server
          test -x /tmp/rollback-verify/moesekai-migrate
          test "$(stat -c %a /tmp/rollback-verify/moesekai-server)" = 755
          test "$(stat -c %a /tmp/rollback-verify/moesekai-migrate)" = 755
          (cd /tmp/rollback-verify && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollback-${{ github.sha }}
          path: dist/moesekai-rollback.tar
          if-no-files-found: error
          overwrite: false
          compression-level: 0
