name: Release NEXT standalone image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve exact NEXT CI artifacts for approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.run_attempt }}
      ci_run_url: ${{ steps.ci.outputs.run_url }}
      candidate_name: ${{ steps.artifacts.outputs.candidate_name }}
      candidate_id: ${{ steps.artifacts.outputs.candidate_id }}
      candidate_digest: ${{ steps.artifacts.outputs.candidate_digest }}
      rollback_name: ${{ steps.artifacts.outputs.rollback_name }}
      rollback_id: ${{ steps.artifacts.outputs.rollback_id }}
      rollback_digest: ${{ steps.artifacts.outputs.rollback_digest }}
      rollback_tar_sha256: ${{ steps.review.outputs.rollback_tar_sha256 }}
      image_tar_sha256: ${{ steps.review.outputs.image_tar_sha256 }}
      metadata_sha256: ${{ steps.review.outputs.metadata_sha256 }}
      node_base: ${{ steps.review.outputs.node_base }}
      go_base: ${{ steps.review.outputs.go_base }}
      runtime_base: ${{ steps.review.outputs.runtime_base }}
    steps:
      - name: Check out exact protected NEXT source for verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the current protected main revision before review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          current_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$current_tip" = "$GITHUB_SHA"

      - name: Require successful push CI for the exact NEXT commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs")
          selected=$(printf '%s' "$runs" | jq -c --arg sha "$GITHUB_SHA" --arg branch "$DEFAULT_BRANCH" --arg repository "$GITHUB_REPOSITORY" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.head_branch == $branch)
              | select(.event == "push")
              | select(.head_repository.full_name == $repository)]
            | sort_by(.run_number, .run_attempt)
            | last // empty')
          test -n "$selected"
          test "$(printf '%s' "$selected" | jq -r .status)" = completed
          test "$(printf '%s' "$selected" | jq -r .conclusion)" = success
          test "$(printf '%s' "$selected" | jq -r .head_sha)" = "$GITHUB_SHA"
          test "$(printf '%s' "$selected" | jq -r .head_branch)" = "$DEFAULT_BRANCH"
          printf 'run_id=%s\n' "$(printf '%s' "$selected" | jq -er '.id | tostring')" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$(printf '%s' "$selected" | jq -er '.run_attempt | tostring')" >> "$GITHUB_OUTPUT"
          printf 'run_url=%s\n' "$(printf '%s' "$selected" | jq -er .html_url)" >> "$GITHUB_OUTPUT"

      - name: Resolve exact CI candidate and rollback artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
        run: |
          set -euo pipefail
          candidate_name="next-production-candidate-${GITHUB_SHA}-${CI_RUN_ATTEMPT}"
          rollback_name="rollback-${GITHUB_SHA}-${CI_RUN_ATTEMPT}"
          artifacts=$(gh api --method GET -f per_page=100 "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts")
          resolve_artifact() {
            local name=$1 selected count artifact_id artifact_digest
            selected=$(printf '%s' "$artifacts" | jq -c --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)]')
            count=$(printf '%s' "$selected" | jq -r 'length')
            test "$count" = 1
            artifact_id=$(printf '%s' "$selected" | jq -er '.[0].id | tostring')
            artifact_digest=$(printf '%s' "$selected" | jq -er '.[0].digest | select(test("^sha256:[0-9a-f]{64}$"))')
            printf '%s\t%s\n' "$artifact_id" "$artifact_digest"
          }
          IFS=$'\t' read -r candidate_id candidate_digest < <(resolve_artifact "$candidate_name")
          IFS=$'\t' read -r rollback_id rollback_digest < <(resolve_artifact "$rollback_name")
          printf 'candidate_name=%s\ncandidate_id=%s\ncandidate_digest=%s\n' "$candidate_name" "$candidate_id" "$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'rollback_name=%s\nrollback_id=%s\nrollback_digest=%s\n' "$rollback_name" "$rollback_id" "$rollback_digest" >> "$GITHUB_OUTPUT"

      - name: Validate exact candidate and rollback inputs before approval
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
          CANDIDATE_ID: ${{ steps.artifacts.outputs.candidate_id }}
          CANDIDATE_DIGEST: ${{ steps.artifacts.outputs.candidate_digest }}
          ROLLBACK_ID: ${{ steps.artifacts.outputs.rollback_id }}
          ROLLBACK_DIGEST: ${{ steps.artifacts.outputs.rollback_digest }}
        run: |
          set -euo pipefail
          candidate_archive="$RUNNER_TEMP/candidate-${CANDIDATE_ID}.zip"
          candidate_dir="$RUNNER_TEMP/next-production-candidate-review"
          rollback_archive="$RUNNER_TEMP/rollback-${ROLLBACK_ID}.zip"
          rollback_dir="$RUNNER_TEMP/next-production-rollback-review"
          rm -rf "$candidate_dir" "$rollback_dir"
          mkdir -p "$candidate_dir" "$rollback_dir"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ID}/zip" > "$candidate_archive"
          test "$(sha256sum "$candidate_archive" | cut -d' ' -f1)" = "${CANDIDATE_DIGEST#sha256:}"
          unzip -q "$candidate_archive" -d "$candidate_dir"
          cd "$candidate_dir"
          test "$(find . -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | sort | tr '\n' ' ')" = 'f:SHA256SUMS f:image.tar f:metadata.json '
          test "$(find . -mindepth 2 -print -quit)" = ''
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
          test "$(awk 'NF == 2 {print $2}' SHA256SUMS | sort | tr '\n' ' ')" = 'image.tar metadata.json '
          if awk 'NF != 2 || $1 !~ /^[0-9a-f]{64}$/ || ($2 != "image.tar" && $2 != "metadata.json") {exit 1}' SHA256SUMS; then :; else exit 1; fi
          sha256sum -c SHA256SUMS
          jq -e \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$CI_RUN_ID" \
            --argjson runAttempt "$CI_RUN_ATTEMPT" '
              keys == ["build", "ci", "image", "schemaVersion", "source"] and
              .schemaVersion == 1 and
              (.source | keys == ["ref", "repository", "revision"]) and
              .source == {repository: $repository, revision: $revision, ref: $ref} and
              (.ci | keys == ["runAttempt", "runId"]) and
              .ci == {runId: $runId, runAttempt: $runAttempt} and
              (.build | keys == ["baseImages", "mode", "target"]) and
              .build.target == "next-production" and .build.mode == "standalone" and
              (.build.baseImages | keys == ["go", "node", "runtime"]) and
              (all(.build.baseImages[]; test("^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$"))) and
              (.image | keys == ["imageId", "localReference"]) and
              (.image.localReference | test("^nexttrans-standalone-ci:[0-9a-f]{40}$")) and
              (.image.imageId | test("^sha256:[0-9a-f]{64}$"))
            ' metadata.json > /dev/null
          printf 'image_tar_sha256=%s\n' "$(sha256sum image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'metadata_sha256=%s\n' "$(sha256sum metadata.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'node_base=%s\n' "$(jq -er .build.baseImages.node metadata.json)" >> "$GITHUB_OUTPUT"
          printf 'go_base=%s\n' "$(jq -er .build.baseImages.go metadata.json)" >> "$GITHUB_OUTPUT"
          printf 'runtime_base=%s\n' "$(jq -er .build.baseImages.runtime metadata.json)" >> "$GITHUB_OUTPUT"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROLLBACK_ID}/zip" > "$rollback_archive"
          test "$(sha256sum "$rollback_archive" | cut -d' ' -f1)" = "${ROLLBACK_DIGEST#sha256:}"
          unzip -q "$rollback_archive" -d "$rollback_dir"
          test "$(find "$rollback_dir" -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | sort | tr '\n' ' ')" = 'f:nexttrans-rollback.tar '
          test "$(find "$rollback_dir" -mindepth 2 -print -quit)" = ''
          python3 "$GITHUB_WORKSPACE/scripts/verify-rollback-bundle.py" "$rollback_dir/nexttrans-rollback.tar"
          printf 'rollback_tar_sha256=%s\n' "$(sha256sum "$rollback_dir/nexttrans-rollback.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Record exact inputs awaiting production approval
        shell: bash
        env:
          CI_RUN_URL: ${{ steps.ci.outputs.run_url }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
          CANDIDATE_NAME: ${{ steps.artifacts.outputs.candidate_name }}
          CANDIDATE_ID: ${{ steps.artifacts.outputs.candidate_id }}
          CANDIDATE_DIGEST: ${{ steps.artifacts.outputs.candidate_digest }}
          ROLLBACK_NAME: ${{ steps.artifacts.outputs.rollback_name }}
          ROLLBACK_ID: ${{ steps.artifacts.outputs.rollback_id }}
          ROLLBACK_DIGEST: ${{ steps.artifacts.outputs.rollback_digest }}
          ROLLBACK_TAR_SHA256: ${{ steps.review.outputs.rollback_tar_sha256 }}
          NODE_BASE: ${{ steps.review.outputs.node_base }}
          GO_BASE: ${{ steps.review.outputs.go_base }}
          RUNTIME_BASE: ${{ steps.review.outputs.runtime_base }}
        run: |
          {
            echo '### Exact inputs awaiting production approval'
            echo
            echo "- Source: \`${GITHUB_REPOSITORY}@${GITHUB_SHA}\`"
            echo "- CI: [attempt ${CI_RUN_ATTEMPT}](${CI_RUN_URL})"
            echo "- Candidate: \`${CANDIDATE_NAME}\` (ID \`${CANDIDATE_ID}\`, \`${CANDIDATE_DIGEST}\`)"
            echo "- Rollback: \`${ROLLBACK_NAME}\` (ID \`${ROLLBACK_ID}\`, archive \`${ROLLBACK_DIGEST}\`, tar SHA-256 \`${ROLLBACK_TAR_SHA256}\`)"
            echo "- Node base: \`${NODE_BASE}\`"
            echo "- Go base: \`${GO_BASE}\`"
            echo "- Runtime base: \`${RUNTIME_BASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Verify and publish approved NEXT standalone image
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
      packages: none
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.final.outputs.image_digest }}
    env:
      NEXT_PREDICATE_TYPE: ${{ github.server_url }}/${{ github.repository }}/attestations/next-production-image/v1
      CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
      CI_RUN_ATTEMPT: ${{ needs.prepare.outputs.ci_run_attempt }}
      CI_RUN_URL: ${{ needs.prepare.outputs.ci_run_url }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.prepare.outputs.candidate_name }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.prepare.outputs.candidate_id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.candidate_digest }}
      ROLLBACK_ARTIFACT_NAME: ${{ needs.prepare.outputs.rollback_name }}
      ROLLBACK_ARTIFACT_ID: ${{ needs.prepare.outputs.rollback_id }}
      ROLLBACK_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.rollback_digest }}
      REVIEWED_ROLLBACK_TAR_SHA256: ${{ needs.prepare.outputs.rollback_tar_sha256 }}
      REVIEWED_IMAGE_TAR_SHA256: ${{ needs.prepare.outputs.image_tar_sha256 }}
      REVIEWED_METADATA_SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
      REVIEWED_NODE_BASE: ${{ needs.prepare.outputs.node_base }}
      REVIEWED_GO_BASE: ${{ needs.prepare.outputs.go_base }}
      REVIEWED_RUNTIME_BASE: ${{ needs.prepare.outputs.runtime_base }}
    steps:
      - name: Check out exact protected NEXT source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the current protected main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = main
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          current_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$current_tip" = "$GITHUB_SHA"

      - name: Download the approved exact CI candidate by artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/next-production-candidate
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/candidate-${CANDIDATE_ARTIFACT_ID}.zip"
          rm -rf "$CANDIDATE_DIR"
          mkdir -p "$CANDIDATE_DIR"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "${CANDIDATE_ARTIFACT_DIGEST#sha256:}"
          unzip -q "$archive" -d "$CANDIDATE_DIR"

      - name: Download and validate the approved exact CI rollback by artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_DIR: ${{ runner.temp }}/next-production-rollback
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rollback-${ROLLBACK_ARTIFACT_ID}.zip"
          rm -rf "$ROLLBACK_DIR"
          mkdir -p "$ROLLBACK_DIR"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROLLBACK_ARTIFACT_ID}/zip" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "${ROLLBACK_ARTIFACT_DIGEST#sha256:}"
          unzip -q "$archive" -d "$ROLLBACK_DIR"
          test "$(find "$ROLLBACK_DIR" -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | sort | tr '\n' ' ')" = 'f:nexttrans-rollback.tar '
          test "$(find "$ROLLBACK_DIR" -mindepth 2 -print -quit)" = ''
          test "$(sha256sum "$ROLLBACK_DIR/nexttrans-rollback.tar" | cut -d' ' -f1)" = "$REVIEWED_ROLLBACK_TAR_SHA256"
          python3 "$GITHUB_WORKSPACE/scripts/verify-rollback-bundle.py" "$ROLLBACK_DIR/nexttrans-rollback.tar"

      - name: Validate and load the exact tested CI candidate
        id: candidate
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/next-production-candidate
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          test "$(find . -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | sort | tr '\n' ' ')" = 'f:SHA256SUMS f:image.tar f:metadata.json '
          test "$(find . -mindepth 2 -print -quit)" = ''
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = 2
          test "$(awk 'NF == 2 {print $2}' SHA256SUMS | sort | tr '\n' ' ')" = 'image.tar metadata.json '
          if awk 'NF != 2 || $1 !~ /^[0-9a-f]{64}$/ || ($2 != "image.tar" && $2 != "metadata.json") {exit 1}' SHA256SUMS; then :; else exit 1; fi
          sha256sum -c SHA256SUMS
          test "$(sha256sum image.tar | cut -d' ' -f1)" = "$REVIEWED_IMAGE_TAR_SHA256"
          test "$(sha256sum metadata.json | cut -d' ' -f1)" = "$REVIEWED_METADATA_SHA256"
          jq -e \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$CI_RUN_ID" \
            --argjson runAttempt "$CI_RUN_ATTEMPT" '
              keys == ["build", "ci", "image", "schemaVersion", "source"] and
              .schemaVersion == 1 and
              (.source | keys == ["ref", "repository", "revision"]) and
              .source == {repository: $repository, revision: $revision, ref: $ref} and
              (.ci | keys == ["runAttempt", "runId"]) and
              .ci == {runId: $runId, runAttempt: $runAttempt} and
              (.build | keys == ["baseImages", "mode", "target"]) and
              .build.target == "next-production" and .build.mode == "standalone" and
              (.build.baseImages | keys == ["go", "node", "runtime"]) and
              (all(.build.baseImages[]; test("^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$"))) and
              (.image | keys == ["imageId", "localReference"]) and
              (.image.localReference | test("^nexttrans-standalone-ci:[0-9a-f]{40}$")) and
              (.image.imageId | test("^sha256:[0-9a-f]{64}$"))
            ' metadata.json > /dev/null
          test "$(jq -er .build.baseImages.node metadata.json)" = "$REVIEWED_NODE_BASE"
          test "$(jq -er .build.baseImages.go metadata.json)" = "$REVIEWED_GO_BASE"
          test "$(jq -er .build.baseImages.runtime metadata.json)" = "$REVIEWED_RUNTIME_BASE"
          local_image=$(jq -er .image.localReference metadata.json)
          expected_image_id=$(jq -er .image.imageId metadata.json)
          docker load --input image.tar > "$RUNNER_TEMP/next-production-docker-load.log"
          test "$(docker image inspect --format '{{.Id}}' "$local_image")" = "$expected_image_id"
          test "$(docker image inspect --format '{{.Config.User}}' "$local_image")" = '65532:65532'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$local_image")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "io.nexttrans.release.mode"}}' "$local_image")" = standalone
          test "$(docker image inspect --format '{{index .Config.Labels "io.nexttrans.release.workflow"}}' "$local_image")" = .github/workflows/release-next.yml
          image_env=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$local_image")
          printf '%s\n' "$image_env" | grep -Fx 'MOESEKAI_PRODUCTION=true'
          printf '%s\n' "$image_env" | grep -Fx 'WORKSPACE_MODE=disabled'
          printf '%s\n' "$image_env" | grep -Fx 'WEB_DIR=/app/web'
          printf '%s\n' "$image_env" | grep -Fx 'DB_PATH=/data/moesekai.db'
          printf '%s\n' "$image_env" | grep -Fx 'TZ=UTC'
          if printf '%s\n' "$image_env" | grep -Eq '^WORKSPACE_(WEB_DIR|MANIFEST_SHA256)='; then exit 1; fi
          docker run --rm --entrypoint /bin/sh "$local_image" -c 'test "$TZ" = UTC && (test -s /usr/share/zoneinfo/UTC || test -s /usr/share/zoneinfo/Etc/UTC)'
          printf 'local_image=%s\nimage_id=%s\n' "$local_image" "$expected_image_id" >> "$GITHUB_OUTPUT"
          printf 'image_tar_sha256=%s\n' "$(sha256sum image.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'metadata_sha256=%s\n' "$(sha256sum metadata.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'node_base=%s\n' "$(jq -er .build.baseImages.node metadata.json)" >> "$GITHUB_OUTPUT"
          printf 'go_base=%s\n' "$(jq -er .build.baseImages.go metadata.json)" >> "$GITHUB_OUTPUT"
          printf 'runtime_base=%s\n' "$(jq -er .build.baseImages.runtime metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Install exact Cosign v3.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Require exact Cosign runtime version
        shell: bash
        run: test "$(cosign version --json | jq -r .gitVersion)" = "v3.1.2"

      - name: Derive staging and immutable image names
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repository}"
          staging_tag="${image}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          final_tag="${image}:next-${GITHUB_SHA}"
          printf 'image=%s\nstaging_tag=%s\nfinal_tag=%s\n' "$image" "$staging_tag" "$final_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry with the protected writer
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_RELEASE_USERNAME }}
          password: ${{ secrets.GHCR_RELEASE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Require the run-scoped staging tag to be unused
        shell: bash
        env:
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
        run: |
          set -euo pipefail
          diagnostic="$RUNNER_TEMP/staging-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          if docker buildx imagetools inspect "$STAGING_TAG" > /dev/null 2> "$diagnostic"; then
            echo 'run-scoped staging tag already exists' >&2
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|name unknown' "$diagnostic"

      - name: Push the exact tested CI candidate to the staging tag
        id: push
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.candidate.outputs.local_image }}
          IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$STAGING_TAG"
          docker push "$STAGING_TAG"
          raw_manifest="$RUNNER_TEMP/next-staging-manifest.json"
          docker buildx imagetools inspect "$STAGING_TAG" --raw > "$raw_manifest"
          test "$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$raw_manifest")" = "$IMAGE_ID"
          image_digest=$(docker buildx imagetools inspect "$STAGING_TAG" --format '{{json .Manifest}}' \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

      - name: Require staging tag to resolve to the built digest
        shell: bash
        env:
          STAGING_TAG: ${{ steps.image.outputs.staging_tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          staging_digest=$(docker buildx imagetools inspect "$STAGING_TAG" --format '{{json .Manifest}}' \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          test "$staging_digest" = "$IMAGE_DIGEST"

      - name: Create canonical NEXT-only predicate
        id: predicate
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          CANDIDATE_IMAGE_TAR_SHA256: ${{ steps.candidate.outputs.image_tar_sha256 }}
          CANDIDATE_METADATA_SHA256: ${{ steps.candidate.outputs.metadata_sha256 }}
          NODE_BASE: ${{ steps.candidate.outputs.node_base }}
          GO_BASE: ${{ steps.candidate.outputs.go_base }}
          RUNTIME_BASE: ${{ steps.candidate.outputs.runtime_base }}
        run: |
          set -euo pipefail
          predicate="$RUNNER_TEMP/next-predicate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          jq -nS \
            --arg repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg releaseWorkflow '.github/workflows/release-next.yml' \
            --arg releaseWorkflowSha "$GITHUB_SHA" \
            --arg ciWorkflow '.github/workflows/ci.yml' \
            --arg ciRunId "$CI_RUN_ID" \
            --argjson ciRunAttempt "$CI_RUN_ATTEMPT" \
            --arg ciRunUrl "$CI_RUN_URL" \
            --arg candidateArtifactName "$CANDIDATE_ARTIFACT_NAME" \
            --arg candidateArtifactId "$CANDIDATE_ARTIFACT_ID" \
            --arg candidateArtifactDigest "$CANDIDATE_ARTIFACT_DIGEST" \
            --arg candidateImageTarSha256 "$CANDIDATE_IMAGE_TAR_SHA256" \
            --arg candidateMetadataSha256 "$CANDIDATE_METADATA_SHA256" \
            --arg rollbackArtifactName "$ROLLBACK_ARTIFACT_NAME" \
            --arg rollbackArtifactId "$ROLLBACK_ARTIFACT_ID" \
            --arg rollbackArtifactDigest "$ROLLBACK_ARTIFACT_DIGEST" \
            --arg rollbackTarSha256 "$REVIEWED_ROLLBACK_TAR_SHA256" \
            --arg nodeBase "$NODE_BASE" \
            --arg goBase "$GO_BASE" \
            --arg runtimeBase "$RUNTIME_BASE" \
            --arg image "$IMAGE" \
            --arg imageDigest "$IMAGE_DIGEST" '
              {
                schemaVersion: 1,
                source: {
                  repository: $repository,
                  revision: $revision,
                  ref: $ref
                },
                workflows: {
                  release: {
                    path: $releaseWorkflow,
                    sha: $releaseWorkflowSha
                  },
                  ci: {
                    path: $ciWorkflow,
                    runId: $ciRunId,
                    runAttempt: $ciRunAttempt,
                    url: $ciRunUrl,
                    candidateArtifact: {
                      name: $candidateArtifactName,
                      id: $candidateArtifactId,
                      digest: $candidateArtifactDigest,
                      imageTarSha256: $candidateImageTarSha256,
                      metadataSha256: $candidateMetadataSha256
                    },
                    rollbackArtifact: {
                      name: $rollbackArtifactName,
                      id: $rollbackArtifactId,
                      digest: $rollbackArtifactDigest,
                      tarSha256: $rollbackTarSha256
                    }
                  }
                },
                build: {
                  target: "next-production",
                  mode: "standalone",
                  baseImages: {
                    node: $nodeBase,
                    go: $goBase,
                    runtime: $runtimeBase
                  }
                },
                image: {
                  repository: $image,
                  digest: $imageDigest
                }
              }' > "$predicate"
          jq -e '
            keys == ["build", "image", "schemaVersion", "source", "workflows"] and
            .schemaVersion == 1 and
            .build.target == "next-production" and
            .build.mode == "standalone" and
            (all(.build.baseImages[]; test("^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$"))) and
            (.workflows.ci.candidateArtifact.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.workflows.ci.candidateArtifact.imageTarSha256 | test("^[0-9a-f]{64}$")) and
            (.workflows.ci.candidateArtifact.metadataSha256 | test("^[0-9a-f]{64}$")) and
            (.workflows.ci.rollbackArtifact.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.workflows.ci.rollbackArtifact.tarSha256 | test("^[0-9a-f]{64}$")) and
            (.image.digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$predicate" > /dev/null
          printf 'path=%s\n' "$predicate" >> "$GITHUB_OUTPUT"

      - name: Sign attest and strictly verify the staged digest with GitHub OIDC
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PREDICATE: ${{ steps.predicate.outputs.path }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          subject_sha=${IMAGE_DIGEST#sha256:}
          subject="${IMAGE}@${IMAGE_DIGEST}"
          cosign sign --yes "$subject"
          cosign attest --yes \
            --type "$NEXT_PREDICATE_TYPE" \
            --predicate "$PREDICATE" \
            "$subject"

          certificate_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-next.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$subject" > /dev/null

          verification="$RUNNER_TEMP/next-attestation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cosign verify-attestation \
            --type "$NEXT_PREDICATE_TYPE" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$subject" > "$verification"

          jq -e -s \
            --arg image "$IMAGE" \
            --arg digest "$subject_sha" \
            --arg predicateType "$NEXT_PREDICATE_TYPE" \
            --slurpfile expected "$PREDICATE" '
              [.[] | if type == "array" then .[] else . end] as $envelopes
              | ($envelopes | length) > 0
              and any($envelopes[];
                .payloadType == "application/vnd.in-toto+json"
                and ((.payload | @base64d | fromjson) as $statement
                  | $statement._type == "https://in-toto.io/Statement/v0.1"
                  and $statement.predicateType == $predicateType
                  and $statement.subject == [{name: $image, digest: {sha256: $digest}}]
                  and $statement.predicate == $expected[0])
              )
            ' "$verification" > /dev/null

      - name: Generate GitHub NEXT predicate attestation when enabled
        if: vars.GITHUB_ARTIFACT_ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: ${{ env.NEXT_PREDICATE_TYPE }}
          predicate-path: ${{ steps.predicate.outputs.path }}
          push-to-registry: false

      - name: Publish only the immutable commit tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          FINAL_TAG: ${{ steps.image.outputs.final_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          current_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$current_tip" = "$GITHUB_SHA"
          inspect_tag() {
            local diagnostic manifest
            diagnostic="$RUNNER_TEMP/final-tag-inspect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
            if manifest=$(docker buildx imagetools inspect "$FINAL_TAG" --format '{{json .Manifest}}' 2> "$diagnostic"); then
              printf '%s' "$manifest" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
              return 0
            fi
            grep -Eqi 'not found|manifest unknown|name unknown' "$diagnostic"
            printf '%s\n' '-'
          }

          existing=$(inspect_tag)
          case "$existing" in
            -)
              current_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
              test "$current_tip" = "$GITHUB_SHA"
              docker buildx imagetools create --prefer-index=false --tag "$FINAL_TAG" "${IMAGE}@${IMAGE_DIGEST}"
              ;;
            "$IMAGE_DIGEST")
              ;;
            *)
              echo "immutable commit tag already points to a different digest: $existing" >&2
              exit 1
              ;;
          esac
          test "$(inspect_tag)" = "$IMAGE_DIGEST"
          current_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$current_tip" = "$GITHUB_SHA"

      - name: Output final immutable image digest
        id: final
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          FINAL_TAG: ${{ steps.image.outputs.final_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo '### NEXT standalone image publication'
            echo
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- Immutable commit tag: \`${FINAL_TAG}\`"
            echo '- No floating tag was created.'
          } >> "$GITHUB_STEP_SUMMARY"
